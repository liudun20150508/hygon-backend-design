<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<title>AI 副驾 — 后端工程师智能体工作台</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;
--green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#58a6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 "SF Mono",Menlo,Consolas,monospace;padding:24px}
h1{font-size:20px;margin-bottom:4px}
h2{font-size:14px;color:var(--blue);margin:20px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.card .k{color:var(--dim);font-size:11px;text-transform:uppercase}
.card .v{font-size:20px;font-weight:bold;margin-top:4px}
.card .d{font-size:11px;color:var(--dim);margin-top:2px}
.ok{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--yellow)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:normal}
tr:hover{background:#1c2129}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;margin-right:4px}
.tag.stage{background:#1f6feb33;color:var(--blue)}
.tag.pit{background:#d2992233;color:var(--yellow)}
.tag.run{background:#3fb95033;color:var(--green)}
.pitbox{background:#161b22;border:1px solid #d2992266;border-radius:8px;padding:12px;margin:8px 0}
.pitbox .t{color:var(--yellow);font-weight:bold;font-size:13px}
.pitbox pre{white-space:pre-wrap;color:var(--dim);font-size:12px;margin-top:6px}
#trend{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
#trend canvas{width:100%;height:180px}
.foot{color:var(--dim);font-size:11px;margin-top:24px;text-align:center}
</style></head><body>
<h1>⚡ AI 副驾 — 后端工程师智能体工作台</h1>
<div class="sub">开源 RTL2GDS 全流程 · LLM Agent 决策闭环 · 坑知识库 · 决策可追溯 &nbsp;|&nbsp; Yosys / OpenROAD / KLayout / LLM</div>

<h2>📊 指标面板 (自动解析自报告)</h2>
<div class="grid" id="metricCards"></div>

<h2>📈 回归迭代曲线 (WNS / 面积)</h2>
<div id="trend"><canvas id="cv" height="180"></canvas></div>

<h2>🕳 坑库命中记录</h2>
<div id="pits"></div>

<h2>📜 Agent 决策记录</h2>
<table id="dec"></table>
<div class="foot">AI Co-pilot for Physical Design Engineers — 引擎可替换 (Claude Code / 本地 LLM), 领域层自研</div>
<script>
const D = __DATA__;
const fmt = (n)=>(n===undefined||n===null)?"—":(typeof n==="number"?n.toFixed(2):n);
function card(k,v,d,cls){return `<div class="card"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div><div class="d">${d||''}</div></div>`}
const m0 = D.metrics.base_nangate45||{}, m1 = D.metrics.llm_sky130||{};
let cards = "";
cards += card("WNS (45nm 800MHz)", fmt(m0.wns_max), "Nangate45 基线", m0.wns_max<0?"bad":"ok");
cards += card("WNS (SKY130 50MHz)", fmt(m1.wns_max), "TCU 版运行中", m1.wns_max===undefined?"warn":(m1.wns_max<0?"bad":"ok"));
cards += card("单元面积 (45nm)", (m0.cell_area_um2? (m0.cell_area_um2/1e6).toFixed(3)+" mm²":"—"), "Nangate45 基线");
cards += card("单元面积 (SKY130)", (m1.cell_area_um2? (m1.cell_area_um2/1e6).toFixed(3)+" mm²":"—"), "TCU 版运行中");
cards += card("时序单元占比", fmt(m0.seq_ratio_pct)+"%", "Nangate45 基线");
cards += card("hold slack", fmt(m0.worst_slack_min), "Nangate45 基线");
document.getElementById("metricCards").innerHTML = cards;

// 迭代曲线: 从决策记录提取 wns 序列
const pts = [];
for (const d of D.decisions){
  for (const key of ["metrics_baseline","metrics_after"]){
    if (d[key] && d[key].wns_max !== undefined) pts.push({x:d.ts.slice(11,16), y:d[key].wns_max, tag:d.stage||d.event});
  }
}
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
cv.width = cv.clientWidth*2; cv.height = 180*2;
ctx.scale(2,2); ctx.clearRect(0,0,cv.width,cv.height);
ctx.strokeStyle="#30363d"; ctx.fillStyle="#8b949e"; ctx.font="10px monospace";
const W=cv.clientWidth, H=180;
ctx.beginPath(); for(let i=1;i<5;i++){ctx.moveTo(0,H*i/5);ctx.lineTo(W,H*i/5)} ctx.stroke();
if (pts.length>1){
  const ys=pts.map(p=>p.y), ymin=Math.min(...ys), ymax=Math.max(...ys);
  const x=(i)=>W*i/(pts.length-1), y=(v)=>H-((v-ymin)/((ymax-ymin)||1))*(H-30)-10;
  ctx.strokeStyle="#3fb950"; ctx.lineWidth=2; ctx.beginPath();
  pts.forEach((p,i)=>{i?ctx.lineTo(x(i),y(p.y)):ctx.moveTo(x(i),y(p.y))}); ctx.stroke();
  ctx.fillStyle="#8b949e"; pts.forEach((p,i)=>{ctx.fillText(p.y.toFixed(2)+" "+p.tag, x(i), y(p.y)-6)});
} else ctx.fillText("等待回归数据 (TCU 版跑批完成后自动出现)", 10, 90);

// 坑库命中
let pits = "";
for (const d of D.decisions) if (d.event==="pitfall")
  pits += `<div class="pitbox"><div class="t">🕳 ${d.pitfall} — ${d.title}</div><pre>诊断: ${d.diagnosis}\n修复: ${d.fix}</pre></div>`;
if(!pits) pits = `<div class="sub">坑库 4 条就绪 (PIT-001~004), 跑批命中后自动展示</div>`;
document.getElementById("pits").innerHTML = pits;

// 决策记录表
let rows = `<tr><th>时间</th><th>事件</th><th>阶段</th><th>结果</th><th>指标</th></tr>`;
for (const d of [...D.decisions].reverse()){
  const tag = d.event==="pitfall" ? '<span class="tag pit">坑</span>'
    : d.event==="run_start" ? '<span class="tag run">开始</span>' : '<span class="tag stage">阶段</span>';
  let met = "";
  const m = d.metrics_after||{};
  if (d.event==="stage") met = `WNS ${fmt(m.wns_max)} 面积 ${m.cell_area_um2?(m.cell_area_um2/1e6).toFixed(3)+"mm²":"—"}`;
  if (d.event==="run_start") met = `WNS ${fmt((d.metrics_baseline||{}).wns_max)}`;
  const st = d.exit===0?'<span class="ok">✓</span>':`<span class="bad">✗ (${d.exit})</span>`;
  rows += `<tr><td>${d.ts}</td><td>${tag}${d.event}</td><td>${d.stage||d.pitfall||""}</td><td>${d.event==="stage"?st:"—"}</td><td>${met}</td></tr>`;
}
document.getElementById("dec").innerHTML = rows;
</script></body></html>
